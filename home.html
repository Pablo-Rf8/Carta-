<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Un ramo para ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="home.css" />
</head>
<body>

  <a class="back-link" href="index.html" aria-label="Volver al cielo">← volver a la carta</a>

  <main class="ramo-scene" aria-label="Un ramo de flores animado">
    <div class="ramo-caption">
      <span class="ramo-eyebrow">Para ti</span>
      <h1 class="ramo-title">Un ramo que nunca se marchita</h1>
    </div>

    <div class="ramo-container" id="ramoContainer">

      <!-- ===================== PASTO/HIERBA (generado por JS, muchas briznas) ===================== -->
      <div class="grass-field" id="grassField" aria-hidden="true"></div>

      <!-- ===================== MATAS DE HOJAS EN LA BASE (puro CSS, dan volumen verde) ===================== -->
      <div class="leaf-mound mound-1" aria-hidden="true"></div>
      <div class="leaf-mound mound-2" aria-hidden="true"></div>
      <div class="leaf-mound mound-3" aria-hidden="true"></div>
      <div class="leaf-mound mound-4" aria-hidden="true"></div>
      <div class="leaf-mound mound-5" aria-hidden="true"></div>
      <div class="leaf-mound mound-6" aria-hidden="true"></div>
      <div class="leaf-mound mound-7" aria-hidden="true"></div>

      <!-- ===================== TALLOS (7, puro CSS) ===================== -->
      <div class="stem" id="stem-1" data-base-angle="-22" data-len="56"></div>
      <div class="stem" id="stem-2" data-base-angle="-4"  data-len="66"></div>
      <div class="stem" id="stem-3" data-base-angle="20"  data-len="55"></div>
      <div class="stem" id="stem-4" data-base-angle="-10" data-len="42"></div>
      <div class="stem" id="stem-5" data-base-angle="-32" data-len="46"></div>
      <div class="stem" id="stem-6" data-base-angle="30"  data-len="44"></div>
      <div class="stem stem--filler" id="stem-7" data-base-angle="6" data-len="60"></div>

      <!-- ===================== PAPEL QUE ENVUELVE EL RAMO (SVG para html2canvas) ===================== -->
      <div class="paper-wrap" aria-hidden="true">
        <svg class="paper-svg paper-back" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gradBack" x1="0%" y1="0%" x2="40%" y2="100%">
              <stop offset="0%" stop-color="#f3d9ae" />
              <stop offset="60%" stop-color="#d9a468" />
              <stop offset="100%" stop-color="#b9793f" />
            </linearGradient>
          </defs>
          <polygon points="4,16 40,0 60,9 96,18 50,100" fill="url(#gradBack)" />
        </svg>

        <svg class="paper-svg paper-front" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gradFront" x1="0%" y1="0%" x2="30%" y2="100%">
              <stop offset="0%" stop-color="#fffaf2" />
              <stop offset="55%" stop-color="#f6dfb8" />
              <stop offset="100%" stop-color="#e3b47f" />
            </linearGradient>
          </defs>
          <polygon points="9,12 38,24 50,3 64,21 91,9 50,100" fill="url(#gradFront)" />
        </svg>

        <span class="paper-crease"></span>
      </div>

      <!-- ===================== LAZO (puro CSS) ===================== -->
      <div class="bow" aria-hidden="true">
        <span class="bow-tail bow-tail-left"></span>
        <span class="bow-tail bow-tail-right"></span>
        <span class="bow-loop bow-loop-left"></span>
        <span class="bow-loop bow-loop-right"></span>
        <span class="bow-knot"></span>
      </div>

      <!-- ===================== ETIQUETA ===================== -->
      <div class="ramo-tag" aria-hidden="true">Atte: Pablo Andres</div>

      <!-- ===================== HOJAS (fondo, 6: las 4 originales + 2 extra para más verde) ===================== -->
      <div class="flor-wrap leaf leaf-1">
        <img class="flor-mover" data-layer="back" src="img/florRamoComplemento3.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap leaf leaf-2">
        <img class="flor-mover" data-layer="back" data-mirror="1" src="img/florRamoComplemento4.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap leaf leaf-3">
        <img class="flor-mover" data-layer="back" src="img/florRamoComplemento5.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap leaf leaf-4">
        <img class="flor-mover" data-layer="back" data-mirror="1" src="img/florRamoComplemento6.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap leaf leaf-5">
        <img class="flor-mover" data-layer="back" data-mirror="1" src="img/florRamoComplemento3.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap leaf leaf-6">
        <img class="flor-mover" data-layer="back" src="img/florRamoComplemento5.png" alt="" aria-hidden="true">
      </div>

      <!-- ===================== GIRASOLES (medio, 4: 2 originales + 2 extra chicos) ===================== -->
      <div class="flor-wrap sun sun-1">
        <img class="flor-mover" data-layer="mid" src="img/florRamoComplemento1.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-2">
        <img class="flor-mover" data-layer="mid" data-mirror="1" src="img/florRamoComplemento2.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-3">
        <img class="flor-mover tint-a" data-layer="mid" data-mirror="1" src="img/florRamoComplemento1.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-4">
        <img class="flor-mover tint-b" data-layer="mid" src="img/florRamoComplemento2.png" alt="" aria-hidden="true">
      </div>

      <!-- ===================== PEONÍAS (frente, 9: 4 principales + 5 chicas de relleno) ===================== -->
      <div class="flor-wrap peony peony-1">
        <img class="flor-mover" data-layer="front" src="img/florRamo1.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-2">
        <img class="flor-mover" data-layer="front" src="img/florRamo2.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-3">
        <img class="flor-mover" data-layer="front" data-mirror="1" src="img/florRamo3.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-4">
        <img class="flor-mover" data-layer="front" src="img/florRamo4.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-5">

      </div>
      <div class="flor-wrap peony peony-7">
        <img class="flor-mover tint-c" data-layer="mid" data-mirror="1" src="img/florRamo3.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-8">
        <img class="flor-mover tint-a" data-layer="mid" src="img/florRamo4.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-9">
        <img class="flor-mover tint-c" data-layer="front" src="img/florRamo1.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-10">
        <img class="flor-mover tint-b" data-layer="mid" data-mirror="1" src="img/florRamo4.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-11">
        <img class="flor-mover tint-a" data-layer="front" data-mirror="1" src="img/florRamo2.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-12">
        <img class="flor-mover tint-b" data-layer="mid" data-mirror="1" src="img/florRamo3.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-13">
        <img class="flor-mover tint-c" data-layer="mid" src="img/florRamo4.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-14">
        <img class="flor-mover tint-a" data-layer="mid" data-mirror="1" src="img/florRamo2.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-15">
        <img class="flor-mover tint-b" data-layer="mid" src="img/florRamo1.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-16">
        <img class="flor-mover tint-c" data-layer="back" src="img/florRamo3.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-17">
        <img class="flor-mover tint-a" data-layer="front" data-mirror="1" src="img/florRamo4.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-18">
        <img class="flor-mover tint-b" data-layer="front" src="img/florRamo2.png" alt="Peonía rosada" aria-hidden="true">
      </div>
      <div class="flor-wrap peony peony-19">

      </div>
      <div class="flor-wrap peony peony-20">

      <div class="flor-wrap peony peony-21">

      <div class="flor-wrap peony peony-22">

      </div>
      <div class="flor-wrap sun sun-5">
        <img class="flor-mover tint-c" data-layer="mid" data-mirror="1" src="img/florRamoComplemento1.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-6">
        <img class="flor-mover tint-a" data-layer="mid" src="img/florRamoComplemento2.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-7">
        <img class="flor-mover tint-b" data-layer="mid" data-mirror="1" src="img/florRamoComplemento1.png" alt="" aria-hidden="true">
      </div>
      <div class="flor-wrap sun sun-8">
        <img class="flor-mover tint-c" data-layer="mid" src="img/florRamoComplemento2.png" alt="" aria-hidden="true">
      </div>

      <!-- ===================== LA CARTA EN MEDIO DEL RAMO ===================== -->
      <div class="tarjeta-ramo" id="carta-interactiva">
        <p class="tarjeta-titulo">Para mi niña hermosa ♡</p>
        
        <div class="spotify-box">
          <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/091WW5ysEijNmspo1RUm4U?utm_source=generator&si=14165e26bc3343c1" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <div class="botones-carta">
          <button id="btn-download" class="btn">📸 Guardar Ramo</button>
          <button id="btn-cielo" class="btn btn-magico">Mi Cielo Hermoso</button>
          <button id="btn-libro" class="btn btn-magico">Nuestro Libro</button>
        </div>
      </div>

      <!-- ===================== WIDGETS ARRASTRABLES (Estilo Link Bouquet) ===================== -->
      
      <!-- Widget Spotify -->
      <div class="widget draggable" id="widget-spotify" style="top: 20%; left: 35%;">
       <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/091WW5ysEijNmspo1RUm4U?utm_source=generator&si=35b305ab5a76421f" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>

      <!-- Widget Guardar Ramo -->
      <div class="widget draggable" id="widget-download" style="top: 50%; left: 25%;">
        <button id="btn-download-widget" class="btn">📸 Guardar Foto</button>
      </div>

      <!-- Widget Cielo -->
      <div class="widget draggable" id="widget-cielo" style="top: 40%; left: 48%;">
        <button id="btn-cielo-widget" class="btn btn-magico">✨ Ir al Cielo</button>
      </div>

      <!-- Widget Libro -->
      <div class="widget draggable" id="widget-libro" style="top: 58%; left: 45%;">
        <button id="btn-libro-widget" class="btn btn-magico">📖 Nuestro Libro</button>
      </div>

    </div>
  </main>

  <!-- Agregar esta línea -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script src="home.js"></script>
</body>
</html>
