<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para Mi Cielo ❤️</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Precarga de las imágenes de flores: se piden ya mismo para que estén
       listas cuando el usuario toque el sobre, en vez de arrancar la
       descarga justo en el momento de la animación -->
  <link rel="preload" as="image" href="img/flor1.png">
  <link rel="preload" as="image" href="img/flor2.png">
  <link rel="preload" as="image" href="img/flor3.png">
  <link rel="preload" as="image" href="img/flor4.png">

  <link rel="stylesheet" href="style.css" />

  <!-- Estilos para la ventana mágica y el control de volumen -->
  <style>
    /* Estilo para la ventana mágica que no corta la música */
    #visor-magico {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      border: none; z-index: 9999; background: transparent;
      transition: opacity 1s ease;
    }
    #visor-magico.hidden { opacity: 0; pointer-events: none; }
    #visor-magico.active { opacity: 1; pointer-events: auto; }

    /* Estilo del Control de Volumen Global */
    .volume-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 10000;
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 25px; padding: 8px 15px;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .volume-container span { color: white; font-size: 1rem; }
    #global-volume { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; outline: none; }
    #global-volume::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff9ebb; cursor: pointer; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
  </style>

</head>
<body>

  <!-- Transición suave entre páginas -->
  <div class="page-transition" aria-hidden="true"></div>

  <!-- Música de fondo -->
  <audio id="bg-music" loop preload="auto">
    <source src="audio/A_Love_Like_Her.mp3" type="audio/mp3">
  </audio>

  <!-- CONTROL DE VOLUMEN GLOBAL -->
  <div id="volume-container" class="volume-container">
    <span>🔈</span>
    <input type="range" id="global-volume" min="0" max="1" step="0.01" value="0.3">
    <span>🔊</span>
  </div>

  <!-- Ramo en forma de corazón (Oculto al inicio) -->
  <div id="bloom-stage">
    <div id="bloom-container"></div>
  </div>
  
  <!-- Pétalos cayendo en el fondo -->
  <canvas id="petals-canvas"></canvas>

  <!-- CONTENIDO PRINCIPAL: EL SOBRE -->
  <main class="main-content" id="mainContent">
      <h1 class="hero-title">Para Mi Cielo</h1>
      
      <div class="contenedor">
          <div class="envoltura-sobre" id="sobreInteractuable">
              
              <!-- Piezas del sobre -->
              <div class="sobre"></div>
              <div class="solapa solapa-superior"></div>
              <div class="solapa solapa-derecha"></div>
              <div class="solapa solapa-izquierda"></div>
              
              <!-- Sello -->
              <div class="sello-css" id="selloCss">♥</div>

              <!-- LA CARTA QUE SALE DEL SOBRE -->
              <div class="carta glass-card" id="cartaInterior">
                  <header class="letter-header">
                    <span class="letter-date">29 de Agosto, 2026</span>
                    <h2 class="letter-title">Feliz Primer Mes, Mi Amor</h2>
                    <div class="divider">✦ ✦ ✦</div>
                  </header>

                  <div class="letter-body"><span id="typed-text"></span><span class="cursor" id="cursor"></span></div>

                  <div class="next-journey" id="nextJourney">
                    <a href="#" class="journey-btn" id="journeyBtn" onclick="abrirRamo(event)">
                      Mi regalo <3
                    </a>
                  </div>
              </div>

          </div>
      </div>
  </main>

  <!-- LA VENTANA MÁGICA DONDE VIVIRÁ EL RAMO Y EL LIBRO -->
  <iframe id="visor-magico" class="hidden" src="" allow="autoplay"></iframe>

  <script src="script.js"></script>

  <!-- SCRIPT MÁGICO PARA MÚSICA, TRANSICIÓN Y VOLUMEN -->
  <script>
    // 1. Truco para que la música empiece en cuanto ella toque el sobre
    document.body.addEventListener('click', function startAudio() {
      const musica = document.getElementById('bg-music');
      const volSlider = document.getElementById('global-volume');
      if (musica && musica.paused) {
        musica.volume = volSlider.value; // Toma el valor del slider (0.3)
        musica.play().catch(e => console.log("Esperando interacción..."));
      }
      document.body.removeEventListener('click', startAudio);
    }, { once: true });

    // 2. Función a prueba de fallos para cargar el ramo en la ventana mágica
    function abrirRamo(event) {
      event.preventDefault(); // Evita que la página salte o se cierre
      
      // Ocultamos el sobre y las flores de fondo suavemente
      const mainContent = document.getElementById('mainContent');
      const bloomStage = document.getElementById('bloom-stage');
      const petals = document.getElementById('petals-canvas');
      
      if (mainContent) { mainContent.style.transition = 'opacity 1s ease'; mainContent.style.opacity = '0'; }
      if (bloomStage) { bloomStage.style.transition = 'opacity 1s ease'; bloomStage.style.opacity = '0'; }
      if (petals) { petals.style.transition = 'opacity 1s ease'; petals.style.opacity = '0'; }

      // Esperamos 1 segundo a que se desvanezca y mostramos la ventana mágica con home.html
      setTimeout(() => {
        const visor = document.getElementById('visor-magico');
        if (visor) {
          visor.src = 'home.html'; 
          visor.classList.remove('hidden');
          visor.classList.add('active');
        }
      }, 1000);
    }

    // 3. LÓGICA DEL CONTROL DE VOLUMEN GLOBAL
    const volSlider = document.getElementById('global-volume');
    const musicaPrincipal = document.getElementById('bg-music');
    
    // Aseguramos que la música inicie con el nivel del slider (30%)
    if(musicaPrincipal) musicaPrincipal.volume = volSlider.value;

    volSlider.addEventListener('input', (e) => {
      const nuevoVolumen = e.target.value;
      
      // Cambia el volumen de la música principal
      if(musicaPrincipal) musicaPrincipal.volume = nuevoVolumen;
      
      // Cambia el volumen si está en el libro
      try {
        const visor = document.getElementById('visor-magico');
        if (visor && visor.contentWindow) {
          const musicaLibro = visor.contentWindow.document.getElementById('musica-libro');
          if (musicaLibro) musicaLibro.volume = nuevoVolumen;
        }
      } catch(err) {}
    });
  </script>
</body>
</html>
